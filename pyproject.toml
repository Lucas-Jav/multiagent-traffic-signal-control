[project]
name = "multiagent-traffic-signal-control"
version = "0.1.0"
description = "Bootstrap for a multi-agent traffic signal control project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "sumolib==1.27.1",
    "traci==1.27.1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-audit>=2.9",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
traffic-agents = "traffic_agents.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_agents", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "sumo: integration tests that require Eclipse SUMO and TraCI",
]
